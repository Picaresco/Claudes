# En cada subida: revisión del código y pruebas.
# En main, además: si la versión de package.json aún no tiene «release», se genera el
# ejecutable y se publica con su latest.json, que es lo que la app descarga al
# pulsar «Actualizar».
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Revisión y pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Las pruebas solo usan lo que trae Node: no hace falta instalar dependencias.
      - run: npm test

  publicar:
    name: Publicar la versión
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ¿Está ya publicada esta versión?
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "publicada=si" >> $env:GITHUB_OUTPUT; Write-Host "La versión $version ya está publicada." }
          else { "publicada=no" >> $env:GITHUB_OUTPUT; Write-Host "La versión $version se va a publicar." }
          exit 0
      - name: Instalar dependencias
        if: steps.version.outputs.publicada == 'no'
        run: npm ci --no-audit --no-fund
      - name: Generar el ejecutable
        if: steps.version.outputs.publicada == 'no'
        run: node scripts/package.mjs dist
      - name: Preparar el zip, latest.json y las notas
        if: steps.version.outputs.publicada == 'no'
        run: node scripts/release.mjs dist publicar
      - name: Publicar
        if: steps.version.outputs.publicada == 'no'
        shell: pwsh
        run: gh release create "v${{ steps.version.outputs.version }}" publicar/ClaudHome-win32-x64.zip publicar/latest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ClaudHome ${{ steps.version.outputs.version }}" --notes-file publicar/notas.md
